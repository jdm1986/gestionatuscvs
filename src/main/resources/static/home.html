<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestionaTusCV</title>
    <link rel="stylesheet" href="styles-common.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #333333;
            overflow-x: hidden;
        }
        header {
            background-color: #1C1C1C;
            color: #1C1C1C;
            padding: 1px 0;
            text-align: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        .logo {
            max-width: 150px;
        }
        .container {
            padding: 100px 10px 5px;
            max-width: 1000px;
            margin: auto;
            text-align: center;
            overflow-y: auto;
        }
        h1 {
            color: #E573FE;
        }
        .features {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .feature {
            background-color: #333333;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 30%;
            text-align: center;
            margin-bottom: 10px;
        }
        .feature img {
            max-width: 160px;
            margin-bottom: 1px;
            border-radius: 10px;
        }
        footer {
            background-color: #1C1C1C;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            position: relative;
            width: 100%;
            z-index: 1000;
        }
        .footer-links a {
            color: #E573FE;
            margin: 0 10px;
            text-decoration: none;
        }
        button {
            margin-top: 20px;
            padding: 7px 30px;
            background-color: #E573FE;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            max-width: 200px;
            width: auto;
        }
        @media (max-width: 768px) {
            .features {
                flex-direction: column;
                align-items: center;
            }
            .feature {
                width: 70%;
                margin-bottom: 20px;
            }
            .feature img {
                max-width: 150px;
            }
            button {
                padding: 10px 40px;
                font-size: 16px;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="images/logogestionatuscv.png" alt="Logo GestionaTusCV" class="logo">
      </header>

    <div class="container">
        <div class="features">
            <div class="feature">
                <img src="images/feature1.png" alt="Funcionalidad 1">
                <h3>Organiza tus CVs</h3>
            </div>
            <div class="feature">
                <img src="images/feature2.png" alt="Funcionalidad 2">
                <h3>Comparte con un clic</h3>
            </div>
            <div class="feature">
                <img src="images/feature3.png" alt="Funcionalidad 3">
                <h3>Seguridad garantizada</h3>
            </div>
        </div>

    </div>

    <footer>
        <button onclick="window.location.href='index.html'">INICIO</button>
        <div class="footer-content">
            <div class="footer-links">
                <a href="https://www.jesusdiazmartincv.es" target="_blank">
                    <img src="images/logodeveloper.png" alt="Logo JDM" class="footer-logo">
                </a>
                <a href="privacidad.html">Política de Privacidad</a> |
                <a href="terminos.html">Términos y Condiciones</a> |
                <a href="contacto.html">Contacto</a>
            </div>
            <p>&copy; 2024 GESTIONATUSCV. Todos los derechos reservados.</p>
            <p> || Aplicación Web creada por Jesús Díaz Martín || </p>
        </div>
    </footer>
</body>
</html>
