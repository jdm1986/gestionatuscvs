<!DOCTYPE html>

<body>
<header>
    <!-- Página de inicio de sesión donde los usuarios pueden ingresar su nombre de usuario o email
         y contraseña para acceder a la plataforma GestionaTusCV -->
    <img src="images/logogestionatuscv.png" alt="Logo GestionaTusCV" class="logo" id="logo">
</header>
<div class="container">
    <h1>INICIO DE SESIÓN</h1>
    <form id="loginForm">
        <input type="text" id="login" placeholder="Nombre de Usuario o Email" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit">Iniciar Sesión</button>
        <button type="button" onclick="location.href='index.html'">Volver</button>
    </form>

    <!-- Aquí añadimos el contenedor para el mensaje -->
    <div id="loginMessage" style="color: #FF6F61; text-align: center; margin-top: 10px; display: none;"></div>
    <p>
        <a href="forgot-password.html" class="link-blanco" style="color: white;">¿Olvidaste tu contraseña? Haz clic aquí</a>
    </p>
</div>
<script src="scripts.js"></script>
</body>
