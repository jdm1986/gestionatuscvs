<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Currículum</title>
    <link rel="stylesheet" href="styles-common.css">
</head>
<body>
<header>
    <img src="images/logogestionatuscv.png" alt="Logo GestionaTusCV" class="logo" id="logo">
</header>
<div class="container">
    <h1>Subir Currículum</h1>
    <form id="uploadForm">
        <input type="file" id="pdfFile" accept="application/pdf" required>
        <input type="text" id="nombre" placeholder="Nombre" required>
        <input type="text" id="apellido" placeholder="Apellido" required>
        <select id="sexo" required>
            <option value="">Seleccionar Sexo</option>
            <option value="Hombre">Hombre</option>
            <option value="Mujer">Mujer</option>
            <option value="Otro">Otro</option>
        </select>
        <input type="text" id="telefono" placeholder="Teléfono" required>
        <input type="email" id="email" placeholder="Email" required>
        <button type="submit">Subir</button>
        <button type="button" onclick="location.href='dashboard.html'">Ir a Gestión de Currículums</button>
        <p id="errorMessage" style="color: red; display: none;">Solo se permiten archivos PDF.</p>
    </form>
    <div id="uploadMessage" class="hidden">Currículum subido exitosamente.</div>
</div>
<script src="scripts.js"></script>
</body>
<footer>
    <div class="footer-content">
        <div class="footer-links">
            <a href="privacidad.html">Política de Privacidad</a> |
            <a href="terminos.html">Términos y Condiciones</a> |
            <a href="contacto.html">Contacto</a>
        </div>
        <p>&copy; 2024 GESTIONATUSCV. Todos los derechos reservados.</p>
    </div>
</footer>
</html>
