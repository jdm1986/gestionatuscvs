<!--
    Encabezado de la página con el logo del sitio web.
    La página da la bienvenida a los usuarios y proporciona botones para iniciar sesión o registrarse.
-->
<header>
    <img src="images/logogestionatuscv.png" alt="Logo GestionaTusCV" class="logo">
</header>

<div class="container">
    <!-- Título principal de bienvenida -->
    <h2>BIENVENIDO/A</h2>

    <!--
        Botones de acción para que el usuario pueda iniciar sesión o registrarse.
        Se utilizan para dirigir al usuario a las respectivas páginas de autenticación.
    -->
    <div class="buttons">
        <button id="loginButton">Iniciar Sesión</button> <!-- Botón para ir a la página de inicio de sesión -->
        <button id="registerButton">Registrarse</button> <!-- Botón para ir a la página de registro -->
    </div>
</div>

<!--
    Archivo JavaScript que contiene las funciones para manejar los eventos de los botones.
    Aquí podría haber funciones para redirigir al usuario a las páginas correspondientes al hacer clic.
-->
