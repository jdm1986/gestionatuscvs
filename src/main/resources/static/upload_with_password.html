<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Currículum con Contraseña</title>
    <link rel="stylesheet" href="styles-common.css">
</head>
<body>
<div class="container">
    <h2>Subir Currículum</h2>
    <form id="uploadForm">
        <label for="uploadId">Identificador de Subida:</label>
        <input type="text" id="uploadId" name="uploadId" required>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>
        <label for="pdfFile">Seleccionar archivo:</label>
        <input type="file" id="pdfFile" name="pdfFile" accept="application/pdf" required>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" required>
        <label for="sexo">Sexo:</label>
        <select id="sexo" name="sexo" required>
            <option value="Hombre">Hombre</option>
            <option value="Mujer">Mujer</option>
            <option value="Otro">Otro</option>
        </select>
        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" name="telefono" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <button type="submit">Subir</button>
    </form>
    <div id="uploadMessage" class="hidden">Currículum subido exitosamente.</div>
    <div id="errorMessage" class="hidden">Error al subir el currículum.</div>
</div>
<script src="scripts.js"></script>
</body>
</html>
