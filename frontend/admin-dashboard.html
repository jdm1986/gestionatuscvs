<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="styles-common.css">
</head>
<body>
<header>
    <img src="images/logogestionatuscv.png" alt="Logo GestionaTusCV" class="logo">
    <h1>GESTIONA TUS-CV</h1>
</header>
<div class="container">
    <h1>Panel de Administración</h1>
    <div class="actions">
        <button id="viewRegistrationsButton">Ver Registros de Usuarios</button>
    </div>
    <div id="registrationsLog" class="results hidden">
        <h2>Registros de Usuarios</h2>
        <pre id="logContent"></pre>
    </div>
</div>
<script>
    document.getElementById('viewRegistrationsButton').addEventListener('click', function() {
        fetch('http://localhost:8080/admin/registro-usuarios', {
            method: 'GET',
            headers: {
                'Authorization': 'Bearer ' + localStorage.getItem('token')
            }
        })
        .then(response => {
            if (response.ok) {
                return response.text();
            } else {
                throw new Error('Error al obtener los registros');
            }
        })
        .then(data => {
            const logContainer = document.getElementById('registrationsLog');
            logContainer.classList.remove('hidden');
            document.getElementById('logContent').textContent = data;
        })
        .catch(error => {
            alert(error.message);
        });
    });
</script>
</body>
</html>
