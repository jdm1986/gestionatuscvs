<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="styles-common.css">
</head>
<body>
<header>
    <img src="images/logogestionatuscv.png" alt="Logo GestionaTusCV" class="logo" id="logo">
</header>
<div class="container">
    <h1>Recuperar Contraseña</h1>
    <form id="forgotPasswordForm">
        <input type="email" id="email" placeholder="Introduce tu Email" required>
        <button type="submit">Enviar</button>
        <button type="button" onclick="location.href='index.html'">Volver</button>
    </form>
    <!-- Contenedor para mostrar mensajes -->
    <div id="message" class="hidden"></div>
</div>
<script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const messageContainer = document.getElementById('message');

        const response = await fetch('/auth/forgot-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email: email })
        });

        if (response.ok) {
            const data = await response.json();
            messageContainer.classList.remove('hidden');
            messageContainer.style.color = '#E573FE'; // Color púrpura para éxito
            messageContainer.textContent = data.message;
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 3000); // Redirigir después de 3 segundos
        } else {
            const errorData = await response.json();
            messageContainer.classList.remove('hidden');
            messageContainer.style.color = '#FF6F61'; // Color rojo para el error
            messageContainer.textContent = errorData.message;
        }
    });
</script>
<script src="scripts.js"></script>
</body>
<footer>
    <div class="footer-content">
        <div class="footer-links">
            <a href="privacidad.html">Política de Privacidad</a> |
            <a href="terminos.html">Términos y Condiciones</a> |
            <a href="contacto.html">Contacto</a>
        </div>
        <p>&copy; 2024 GESTIONATUSCV. Todos los derechos reservados.</p>
    </div>
</footer>
</html>
