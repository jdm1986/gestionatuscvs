<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Currículums</title>
    <link rel="stylesheet" href="styles-common.css">
    <link rel="stylesheet" href="styles-dashboard.css">
</head>
<body>
<div class="container">
    <h1>Bienvenido, <span id="username"></span></h1>
    <div class="actions">
        <button onclick="location.href='upload.html'">Subir Currículum</button>
        <button id="logoutButton">Cerrar Sesión</button>
        <button id="viewLogsButton" class="admin-only" style="display:none;">Ver Registros de Usuarios</button> <!-- Botón para ver registros -->
    </div>
    <div class="search">
        <input type="text" id="searchInput" placeholder="Buscar por palabras clave">
        <div class="search-buttons">
            <button id="searchButton">Buscar</button>
            <button id="clearButton">Limpiar Filtros</button>
        </div>
    </div>
    <div class="results">
        <table>
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Fecha de Inserción</th>
                <th>Sexo</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="resultsBody">
            <!-- Aquí se agregarán los resultados dinámicamente -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal para añadir notas -->
<div id="noteModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Notas</h2>
        <textarea id="noteText" placeholder="Escribe tu nota aquí..."></textarea>
        <button id="saveNoteButton">Guardar Nota</button>
        <div id="notesList"></div>
    </div>
</div>

<script src="scripts.js"></script>
</body>
<footer>
    <div class="footer-content">
        <div class="footer-links">
            <a href="privacidad.html">Política de Privacidad</a> |
            <a href="terminos.html">Términos y Condiciones</a> |
            <a href="contacto.html">Contacto</a>
        </div>
        <p>&copy; 2024 GESTIONATUSCV. Todos los derechos reservados.</p>
    </div>
</footer>

</html>
