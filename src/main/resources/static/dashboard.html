<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Currículums</title>
    <link rel="stylesheet" href="styles-common.css">
    <link rel="stylesheet" href="styles-dashboard.css">
</head>
<body>
<header>
    <!-- Página principal del panel de gestión de currículums, donde los usuarios pueden subir CVs,
         realizar búsquedas y generar enlaces de subida. Los administradores también pueden ver los registros. -->
    <img src="images/logogestionatuscv.png" alt="Logo GestionaTusCV" class="logo" id="logo">
</header>
<div class="container">
    <!-- Mensaje de bienvenida personalizado con el nombre del usuario -->
    <h1>BIENVENIDO/A, <span id="username"></span></h1>

    <!-- Botones de acción: subir currículum, cerrar sesión, ver registros (solo admin) -->
    <div class="actions">
        <button onclick="location.href='upload_user.html'">Subir Currículum</button>
        <button id="logoutButton">Cerrar Sesión</button>
        <button id="viewLogsButton" class="admin-only" style="display:none;">Ver Registros de Usuarios</button> <!-- Botón para ver registros -->
        <button id="departamentosButton">Departamentos</button> <!-- Botón para la gestión de departamentos -->
    </div>

    <!-- Sección de búsqueda y filtros -->
    <div class="search">
        <input type="text" id="searchInput" placeholder="Buscar por palabras clave">
        <div class="search-buttons">
            <button id="searchButton">Buscar</button>
            <button id="clearButton">Limpiar Filtros</button>
            <button id="generateLinkButton">Upload Link</button> <!-- Botón para generar un enlace de subida -->
        </div>
        <div class="link-container">
            <!-- Espacio donde se mostrará el enlace generado -->
            <p id="generatedLink" class="generated-link hidden"></p>
            <button id="copyButton" class="copy-button hidden">Copiar enlace</button>
        </div>
    </div>

    <!-- Tabla donde se mostrarán los resultados de búsqueda de CVs -->
    <div class="results">
        <table>
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Fecha</th>
                <th>Sexo</th>
                <th>Teléfono</th>
                <th>Departamento</th> <!-- Nueva columna de departamento -->
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="resultsBody">
            <!-- Aquí se agregarán los resultados dinámicamente -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal para añadir y visualizar notas en los currículums -->
<div id="noteModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Notas</h2>
        <textarea id="noteText" placeholder="Escribe tu nota aquí..."></textarea>
        <button id="saveNoteButton">Guardar Nota</button>
        <div id="notesList"></div>
    </div>
</div>

<!-- Archivo JavaScript donde están las funcionalidades -->
<script src="scripts.js"></script>
<script>
    // Redirige a la página de departamentos cuando se hace clic en el botón
    document.getElementById('departamentosButton').addEventListener('click', function() {
        window.location.href = 'departamentos.html';
    });
</script>

</body>

<!-- Pie de página -->
<footer>
    <div class="footer-content">
        <a href="https://www.jesusdiazmartincv.es" target="_blank"> <!-- Enlace alrededor del logo -->
            <img src="images/logodeveloper.png" alt="Logo JDM" class="footer-logo">
        </a>
        <div class="footer-links">
            <a href="privacidad.html">Política de Privacidad</a> |
            <a href="terminos.html">Términos y Condiciones</a> |
            <a href="contacto.html">Contacto</a>
        </div>
        <p>&copy; 2024 GESTIONATUSCV. Todos los derechos reservados.</p>
        <p> || Aplicación Web creada por Jesús Díaz Martín || </p>
    </div>
</footer>

</html>
