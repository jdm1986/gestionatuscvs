<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="styles-common.css">
</head>
<body>
<!--
    Encabezado:
    Página de registro de usuario para la plataforma GestionaTusCV.
    Permite a los nuevos usuarios crear una cuenta proporcionando la información requerida.
    Incluye el logotipo para mantener la apariencia coherente con el resto del sitio.
-->
<header>
    <img src="images/logogestionatuscv.png" alt="Logo GestionaTusCV" class="logo" id="logo">
</header>

<!-- Contenedor principal para el formulario de registro -->
<div class="container">
    <h1>REGISTRO DE USUARIO/A</h1>
    <form id="registerForm">
        <!-- Campo para el nombre de usuario -->
        <input type="text" id="username" placeholder="Nombre de Usuario/a" required>

        <!-- Campo para el correo electrónico -->
        <input type="email" id="email" placeholder="Email" required>

        <!-- Campo para la contraseña -->
        <input type="password" id="password" placeholder="Contraseña" required>

        <!-- Mensaje de advertencia sobre la eliminación automática de los datos -->
        <p style="color: #ff0000; font-weight: bold;">Evaluación gratuita de 30 minutos.</p>

        <!-- Texto de aceptación de los términos y condiciones -->
        <p style="color: #ffffff;">
            Acepto los <a href="terminos.html" class="link-blanco">Términos de Uso</a> y el <a href="privacidad.html" class="link-blanco">Aviso de Privacidad</a>.
        </p>

        <!-- Checkbox para el consentimiento del usuario -->
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="consent" required>
        </div>

        <!-- Botón para enviar el formulario -->
        <button type="submit">Registrarse</button>

        <!-- Botón para volver a la página principal -->
        <button type="button" onclick="location.href='index.html'">Volver</button>
    </form>

    <!-- Contenedor para mensajes (oculto inicialmente) -->
    <div id="message" class="hidden" style="margin-top: 20px; text-align: center;"></div>
</div>

<!-- Archivo JavaScript con funcionalidades adicionales para la página -->
<script src="scripts.js"></script>

</body>

<!-- Pie de página con enlaces adicionales y créditos -->
<footer>
    <div class="footer-content">
        <!-- Enlace al sitio del desarrollador con el logo correspondiente -->
        <a href="https://www.jesusdiazmartincv.es" target="_blank">
            <img src="images/logodeveloper.png" alt="Logo JDM" class="footer-logo">
        </a>
        <!-- Enlaces a las políticas de privacidad, términos y condiciones, y contacto -->
        <div class="footer-links">
            <a href="privacidad.html">Política de Privacidad</a> |
            <a href="terminos.html">Términos y Condiciones</a> |
            <a href="contacto.html">Contacto</a>
        </div>
        <!-- Información de derechos de autor y créditos -->
        <p>&copy; 2024 GESTIONATUSCV. Todos los derechos reservados.</p>
        <p> || Aplicación Web creada por Jesús Díaz Martín || </p>
    </div>
</footer>

</html>
