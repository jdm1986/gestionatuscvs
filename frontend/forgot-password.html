<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="styles-common.css">
</head>
<body>
<header>
    <img src="images/logogestionatuscv.png" alt="Logo GestionaTusCV" class="logo">
</header>
<div class="container">
    <h1>Recuperar Contraseña</h1>
    <form id="forgotPasswordForm">
        <input type="email" id="email" placeholder="Introduce tu Email" required>
        <button type="submit">Enviar</button>
        <button type="button" onclick="location.href='index.html'">Volver</button>
    </form>
</div>
<script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const email = document.getElementById('email').value;

        const response = await fetch('http://localhost:8080/auth/forgot-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email: email })
        });

        if (response.ok) {
            alert('Se ha enviado un enlace para restablecer la contraseña a tu email.');
            window.location.href = 'login.html';
        } else {
            alert('Error al enviar el email de restablecimiento.');
        }
    });
</script>
</body>
<footer>
    <div class="footer-content">
        <div class="footer-links">
            <a href="privacidad.html">Política de Privacidad</a> |
            <a href="terminos.html">Términos y Condiciones</a> |
            <a href="contacto.html">Contacto</a>
        </div>
        <p>&copy; 2024 GESTIONATUSCV. Todos los derechos reservados.</p>
    </div>
</footer>

</html>
