<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Departamentos</title>
    <link rel="stylesheet" href="styles-departamentos.css">
</head>
<body>
<!--
    Página de gestión de departamentos.
    Permite a los usuarios agregar nuevos departamentos, ver la lista de departamentos existentes,
    y eliminar departamentos según sea necesario.
-->

<header>
    <!-- Logo de la aplicación que aparece en la parte superior de la página -->
    <img src="images/logogestionatuscv.png" alt="Logo GestionaTusCV" class="logo">
</header>

<!-- Título principal de la página -->
<h1>Gestión de Departamentos</h1>

<!--
    Formulario para agregar nuevos departamentos.
    El formulario contiene un campo para el nombre del departamento y un botón para agregarlo.
-->
<form id="departamentoForm">
    <div class="input-container">
        <!-- Campo de entrada para el nombre del departamento -->
        <input type="text" id="nombreDepartamento" placeholder="Nombre del departamento" required>
        <!-- Botón para agregar el departamento a la lista -->
        <button type="submit">Agregar Departamento</button>
    </div>
</form>

<!-- Mensaje de error, se muestra en caso de que ocurra algún problema al agregar un departamento -->
<p id="errorMensaje" style="color:red; display:none;"></p>

<!-- Botón para volver a la página anterior -->
<button id="volverBtn" class="volver-btn">Volver</button>

<!--
    Tabla para mostrar la lista de departamentos existentes.
    Incluye un encabezado con los nombres de las columnas y el cuerpo de la tabla donde se agregarán
    dinámicamente los departamentos cargados desde el servidor.
-->
<table id="tablaDepartamentos">
    <thead>
    <tr>
        <th>Nombre</th> <!-- Columna para el nombre del departamento -->
        <th>Acciones</th> <!-- Columna para las acciones que se pueden realizar (eliminar) -->
    </tr>
    </thead>
    <tbody>
    <!-- Los departamentos se cargarán aquí de forma dinámica -->
    </tbody>
</table>

<!-- Pie de página con información adicional y enlaces relevantes -->
<footer>
    <div class="footer-content">
        <!-- Enlace al sitio web del desarrollador -->
        <a href="https://www.jesusdiazmartincv.es" target="_blank">
            <img src="images/logodeveloper.png" alt="Logo JDM" class="footer-logo">
        </a>
        <div class="footer-links">
            <a href="privacidad.html">Política de Privacidad</a> |
            <a href="terminos.html">Términos y Condiciones</a> |
            <a href="contacto.html">Contacto</a>
        </div>
        <!-- Derechos de autor y créditos al desarrollador -->
        <p>&copy; 2024 GESTIONATUSCV. Todos los derechos reservados.</p>
        <p> || Aplicación Web creada por Jesús Díaz Martín || </p>
    </div>
</footer>

<script>
    // URL base del servidor, se ajusta dependiendo del entorno (local o producción)
    // Usar siempre el mismo origen donde se sirve el frontend (Railway o tu dominio)
    const baseUrl = window.location.origin;

    // Obtiene el userId del usuario almacenado en localStorage
    const userId = localStorage.getItem('userId');
    if (!userId) {
        // Si no hay un userId almacenado, se redirige al usuario a la página de inicio de sesión
        window.location.href = '/login.html';
    }

    // Función para cargar los departamentos asociados al usuario actual
    function loadDepartamentos() {
        // Realiza una solicitud GET al servidor para obtener los departamentos del usuario
        fetch(`${baseUrl}/departamentos?userId=${userId}`, { credentials: 'include' })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error al obtener los departamentos');
                }
                return response.json();
            })
            .then(departamentos => {
                // Limpiamos la tabla antes de cargar los nuevos datos
                const tbody = document.getElementById('tablaDepartamentos').querySelector('tbody');
                tbody.innerHTML = '';

                // Agrega cada departamento a la tabla
                departamentos.forEach(depto => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${depto.nombre}</td>
                        <td>
                            <button class="eliminar-btn" onclick="confirmDelete(${depto.id})">Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(error => console.error("Error al cargar los departamentos:", error));
    }

    // Evento que se ejecuta al enviar el formulario de nuevo departamento
    document.getElementById('departamentoForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Evita el envío del formulario por defecto

        // Obtiene el nombre del departamento ingresado por el usuario
        const nombre = document.getElementById('nombreDepartamento').value.trim();
        const errorMensaje = document.getElementById('errorMensaje');

        // Verifica que el campo no esté vacío
        if (!nombre) {
            errorMensaje.textContent = "Por favor, ingresa un nombre de departamento.";
            errorMensaje.style.display = 'block';
            return;
        }

        // Realiza la solicitud para agregar un nuevo departamento
        fetch(`${baseUrl}/departamentos`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({ nombre, userId }) // Envia el nombre del departamento y el userId
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(text => {
                    errorMensaje.textContent = text; // Muestra el error recibido del servidor
                    errorMensaje.style.display = 'block';
                });
            } else {
                errorMensaje.style.display = 'none'; // Oculta el mensaje de error si no hubo problemas
                return response.json();
            }
        })
        .then(data => {
            if (data) {
                loadDepartamentos(); // Recarga la lista de departamentos
                document.getElementById('nombreDepartamento').value = ''; // Limpia el campo de entrada
            }
        })
        .catch(error => console.error("Error al agregar el departamento:", error));
    });

    // Confirma antes de eliminar un departamento
    function confirmDelete(id) {
        if (confirm("¿Estás seguro de que quieres eliminar este departamento?")) {
            deleteDepartamento(id); // Llama a la función de eliminación si se confirma
        }
    }

    // Función para eliminar un departamento del servidor
    function deleteDepartamento(id) {
        fetch(`${baseUrl}/departamentos/${id}`, { method: 'DELETE', credentials: 'include' })
            .then(() => loadDepartamentos()) // Recarga la lista de departamentos después de eliminar
            .catch(error => console.error("Error al eliminar el departamento:", error));
    }

    // Redirige a la página anterior al hacer clic en el botón "Volver"
    document.getElementById('volverBtn').addEventListener('click', function() {
        window.history.back(); // Vuelve a la página anterior
    });

    // Carga los departamentos al cargar la página
    loadDepartamentos();
</script>
</body>
</html>
